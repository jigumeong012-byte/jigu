spring.application.name=lifequest
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/lifequest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:lifequest}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.jackson.time-zone=Asia/Seoul
lifequest.seed-user=true
